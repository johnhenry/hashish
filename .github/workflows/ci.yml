name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm run format:check
        npm run lint
        npm run typecheck
        npm run test
        npm run build
